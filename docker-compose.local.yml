# Local HTTPS development with auto-generated self-signed certs
# Usage: docker compose -f docker-compose.local.yml up -d
services:
  certs:
    image: alpine:latest
    volumes:
      - certs:/certs
    command: >
      sh -c "
        set -e
        if [ -f /certs/localhost.pem ] && [ -f /certs/localhost-key.pem ]; then
          echo 'Certificates already exist, skipping generation.'
        else
          apk add --no-cache openssl
          openssl req -x509 -nodes -days 365 -newkey rsa:2048
            -keyout /certs/localhost-key.pem
            -out /certs/localhost.pem
            -subj '/CN=localhost'
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:::1'
          echo 'Certificates generated.'
        fi
      "

  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - UPSTREAM_URL=https://marketplace.visualstudio.com
      - PUBLIC_BASE_URL=https://localhost
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      app:
        condition: service_started
    networks:
      - internal

volumes:
  certs:

networks:
  internal:
