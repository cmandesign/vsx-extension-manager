# Local HTTPS development using mkcert
# Usage: docker compose -f docker-compose.local.yml up -d
services:
  mkcert:
    image: golang:alpine
    volumes:
      - certs:/certs
    command: >
      sh -c "
        if [ -f /certs/localhost.pem ] && [ -f /certs/localhost-key.pem ]; then
          echo 'Certificates already exist, skipping generation.'
        else
          apk add --no-cache mkcert > /dev/null 2>&1
          mkcert -cert-file /certs/localhost.pem -key-file /certs/localhost-key.pem localhost 127.0.0.1 ::1
          echo 'Certificates generated.'
        fi
      "

  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=3000
      - UPSTREAM_URL=https://marketplace.visualstudio.com
      - PUBLIC_BASE_URL=https://localhost
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      mkcert:
        condition: service_completed_successfully
      app:
        condition: service_started
    networks:
      - internal

volumes:
  certs:

networks:
  internal:
