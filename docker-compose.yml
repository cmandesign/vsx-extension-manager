services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      UPSTREAM_URL: https://marketplace.visualstudio.com
      PUBLIC_BASE_URL: http://localhost:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: vsx
      DB_PASSWORD: vsx_secret
      DB_NAME: vsx_manager
      SESSION_SECRET: change-me-to-a-random-string
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: vsx_manager
      MYSQL_USER: vsx
      MYSQL_PASSWORD: vsx_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_secret
    depends_on:
      - mysql
    restart: unless-stopped

volumes:
  mysql_data:
